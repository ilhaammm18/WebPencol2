<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Path untuk lengkungan teks KARANG TARUNA -->
    <path id="archTextKarangTaruna" d="M 82,250 A 168,168 0 0,1 418,250" fill="none" />
    
    <!-- Shadow lembut lingkaran -->
    <filter id="logoDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Latar Belakang Lingkaran Putih Utama -->
  <circle cx="250" cy="250" r="242" fill="#FFFFFF" filter="url(#logoDropShadow)" />
  <circle cx="250" cy="250" r="236" fill="#FFFFFF" stroke="#121619" stroke-width="10" />

  <!-- Ring Warna Teal / Cyan Khas Karang Taruna -->
  <circle cx="250" cy="242" r="186" fill="#318797" stroke="#121619" stroke-width="9" />

  <!-- Teks Melengkung KARANG TARUNA -->
  <text font-family="'Outfit', 'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" letter-spacing="4.5">
    <textPath href="#archTextKarangTaruna" startOffset="50%" text-anchor="middle">
      KARANG TARUNA
    </textPath>
  </text>

  <!-- Lingkaran Inti Hitam -->
  <circle cx="250" cy="244" r="105" fill="#121619" stroke="#318797" stroke-width="4.5" />
  
  <!-- Lingkaran Putus-putus Putih di Bagian Dalam -->
  <circle cx="250" cy="244" r="95" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-dasharray="6,5" opacity="0.85" />

  <!-- 4 Lengan & Tangan Saling Menggenggam Pergelangan (Simbol Persatuan / Gotong Royong) -->
  <g stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="#121619">
    <!-- Lengan Atas-Kiri menuju Kanan -->
    <rect x="220" y="196" width="56" height="30" rx="6" />
    <!-- Genggaman Jari Tangan Atas -->
    <line x1="264" y1="196" x2="264" y2="226" stroke="#FFFFFF" stroke-width="2.6" />
    <line x1="270" y1="196" x2="270" y2="226" stroke="#FFFFFF" stroke-width="2.6" />
    <line x1="276" y1="196" x2="276" y2="226" stroke="#FFFFFF" stroke-width="2.6" />

    <!-- Lengan Kanan-Atas menuju Bawah -->
    <rect x="260" y="222" width="30" height="56" rx="6" />
    <!-- Genggaman Jari Tangan Kanan -->
    <line x1="260" y1="264" x2="290" y2="264" stroke="#FFFFFF" stroke-width="2.6" />
    <line x1="260" y1="270" x2="290" y2="270" stroke="#FFFFFF" stroke-width="2.6" />
    <line x1="260" y1="276" x2="290" y2="276" stroke="#FFFFFF" stroke-width="2.6" />

    <!-- Lengan Bawah-Kanan menuju Kiri -->
    <rect x="224" y="260" width="56" height="30" rx="6" />
    <!-- Genggaman Jari Tangan Bawah -->
    <line x1="236" y1="260" x2="236" y2="290" stroke="#FFFFFF" stroke-width="2.6" />
    <line x1="230" y1="260" x2="230" y2="290" stroke="#FFFFFF" stroke-width="2.6" />
    <line x1="224" y1="260" x2="224" y2="290" stroke="#FFFFFF" stroke-width="2.6" />

    <!-- Lengan Kiri-Bawah menuju Atas -->
    <rect x="210" y="210" width="30" height="56" rx="6" />
    <!-- Genggaman Jari Tangan Kiri -->
    <line x1="210" y1="222" x2="240" y2="222" stroke="#FFFFFF" stroke-width="2.6" />
    <line x1="210" y1="216" x2="240" y2="216" stroke="#FFFFFF" stroke-width="2.6" />
    <line x1="210" y1="210" x2="240" y2="210" stroke="#FFFFFF" stroke-width="2.6" />
  </g>

  <!-- PITA / BANNER BAWAH -->
  <!-- Lipatan Sayap Pita Belakang -->
  <g fill="#1F5D68" stroke="#121619" stroke-width="8" stroke-linejoin="round">
    <!-- Sayap Kiri -->
    <polygon points="125,335 70,344 110,362 70,380 135,370 148,345" />
    <!-- Sayap Kanan -->
    <polygon points="375,335 430,344 390,362 430,380 365,370 352,345" />
  </g>

  <!-- Pita Utama (PENCOL 2) -->
  <path d="M 120,332 C 175,324 325,324 380,332 L 372,376 C 320,366 180,366 128,376 Z" 
        fill="#318797" stroke="#121619" stroke-width="9.5" stroke-linejoin="round" />

  <!-- Teks PENCOL 2 di Pita -->
  <text x="250" y="360" font-family="'Outfit', 'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="31" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">
    PENCOL 2
  </text>

  <!-- Lencana Busur Bawah (RANDUSONGO) -->
  <path d="M 182,378 C 205,374 295,374 318,378 C 320,396 312,411 250,416 C 188,411 180,396 182,378 Z" 
        fill="#318797" stroke="#121619" stroke-width="7" stroke-linejoin="round" />

  <!-- Teks RANDUSONGO -->
  <text x="250" y="399" font-family="'Outfit', 'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="15" fill="#FFFFFF" text-anchor="middle" letter-spacing="3.5">
    RANDUSONGO
  </text>
</svg>
